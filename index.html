<!doctype html><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>REAL WORLD</title><style>html,body,#g{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;font:12px system-ui;color:white}#h{position:fixed;top:12px;left:12px;right:12px;text-shadow:0 2px 4px #000;pointer-events:none}#p{position:fixed;bottom:12px;left:12px;background:#0008;padding:10px;border-radius:12px}button{padding:9px 12px;border:0;border-radius:10px;font-weight:700}#s{position:fixed;inset:0;display:grid;place-items:center;background:#081018;z-index:3}#c{background:#0009;padding:25px;border-radius:24px;width:280px;text-align:center}#j{position:fixed;left:20px;bottom:80px;width:120px;height:120px;border:1px solid #fff3;background:#fff1;border-radius:50%;pointer-events:auto}#k{width:48px;height:48px;margin:36px;border-radius:50%;background:#fff5}#l{position:fixed;right:0;top:0;width:65%;height:75%;pointer-events:auto}</style><div id=g></div><div id=h><b>REAL WORLD // LOW POLY</b><div id=t>Waiting…</div></div><div id=p><button id=m>FLY</button><button id=w>CLEAR</button><button id=r>RECENTER</button></div><div id=j><div id=k></div></div><div id=l></div><div id=s><div id=c><h1>REAL WORLD</h1><p>Procedurally render the real world around your GPS location.</p><button id=go>ENTER WORLD</button><p id=x>Location permission required.</p></div></div><script type=module>
import*as T from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const S={fly:1,yaw:0,pitch:0,jx:0,jy:0,lat:0,lon:0};const sc=new T.Scene(),cam=new T.PerspectiveCamera(72,innerWidth/innerHeight,.1,5000),ren=new T.WebGLRenderer({antialias:0});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(innerWidth,innerHeight);document.querySelector('#g').append(ren.domElement);sc.fog=new T.FogExp2(0x91a9b0,.0007);const world=new T.Group;sc.add(world);let mat=c=>new T.MeshLambertMaterial({color:c});let grass=mat(0x506b4a);let roadmat=mat(0x303236);let housemat=mat(0x999383),roofmat=mat(0x514b43),trunkmat=mat(0x60472f),leafmat=mat(0x315b3c);let gnd=new T.Mesh(new T.PlaneGeometry(3000,3000),grass);gnd.rotation.x=-Math.PI/2;world.add(gnd);let sun=new T.DirectionalLight(0xffdfad,2);sun.castShadow=1;sun.position.set(200,400,150);sc.add(sun);sc.add(new T.HemisphereLight(0xb9ddff,0x40502f,1.2));
function xyz(a,b){let ls=111320,lo=ls*Math.cos(S.lat*Math.PI/180);return{x:(b-S.lon)*lo,z:-(a-S.lat)*ls}}function road(P,w){let q=P.map(p=>new T.Vector3(p.x,.03,p.z)),c=new T.CatmullRomCurve3(q),o=new T.Mesh(new T.TubeGeometry(c,Math.max(8,q.length*5),w/2,4),roadmat);world.add(o)}function house(x,z,w,d,h){let b=new T.Mesh(new T.BoxGeometry(w,h,d),housemat);b.position.set(x,h/2,z);b.castShadow=b.receiveShadow=1;world.add(b);let q=new T.Mesh(new T.ConeGeometry(Math.min(w,d)*.72,Math.min(w,d)*.35,4),roofmat);q.rotation.y=Math.PI/4;q.position.set(x,h+.15,z);world.add(q)}function tree(x,z,s){let a=new T.Mesh(new T.CylinderGeometry(.15*s,.22*s,1.5*s,5),trunkmat),b=new T.Mesh(new T.ConeGeometry(1.1*s,2.7*s,6),leafmat);a.position.y=.75*s;b.position.y=2.3*s;let q=new T.Group;q.add(a,b);q.position.set(x,0,z);world.add(q)}
async function load(){let d=.0045,q=`[out:json][timeout:25];(way["highway"](${S.lat-d},${S.lon-d},${S.lat+d},${S.lon+d});way["building"](${S.lat-d},${S.lon-d},${S.lat+d},${S.lon+d}););out geom;`;try{let z=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q}),j=await z.json(),nr=0,nb=0;for(let e of j.elements){if(!e.geometry)continue;if(e.tags?.highway&&e.geometry.length>1){road(e.geometry.map(p=>xyz(p.lat,p.lon)),['motorway','primary','secondary'].includes(e.tags.highway)?10:e.tags.highway==='residential'?6:3);nr++}else if(e.tags?.building){let p=e.geometry.map(q=>xyz(q.lat,q.lon)),xs=p.map(q=>q.x),zs=p.map(q=>q.z),mn=Math.min(...xs),mx=Math.max(...xs),mz=Math.min(...zs),zz=Math.max(...zs),w=Math.min(35,Math.max(3,mx-mn)),d=Math.min(35,Math.max(3,zz-mz));house((mn+mx)/2,(mz+zz)/2,w,d,Math.max(3,(w+d)/5*(.7+Math.random())));nb++}}document.querySelector('#t').textContent=`WORLD LOADED · ${nr} roads · ${nb} buildings`}catch(e){document.querySelector('#t').textContent='Map unavailable · procedural fallback'}for(let i=0;i<320;i++)tree((Math.random()-.5)*900,(Math.random()-.5)*900,.5+Math.random()*1.5)}
function sky(t){let a=(t%240000)/240000*Math.PI*2,d=Math.max(.05,Math.sin(a)*.5+.5);sun.position.set(Math.cos(a)*400,Math.sin(a)*400,150);sun.intensity=d*2;sc.background=new T.Color().setHSL(.57,.35,.07+d*.42);sc.fog.color.copy(sc.background)}let last=performance.now();function loop(n){requestAnimationFrame(loop);let dt=Math.min(.05,(n-last)/1000);last=n;if(S.on){let f=new T.Vector3(Math.sin(S.yaw),0,Math.cos(S.yaw)),r=new T.Vector3(Math.cos(S.yaw),0,-Math.sin(S.yaw));cam.position.add(f.multiplyScalar(S.jy*S.sp*dt)).add(r.multiplyScalar(S.jx*S.sp*dt));cam.position.y=S.fly?Math.max(3,cam.position.y):4.5;cam.rotation.order='YXZ';cam.rotation.y=S.yaw;cam.rotation.x=S.pitch;sky(n)}ren.render(sc,cam)}requestAnimationFrame(loop);
async function start(){document.querySelector('#s').remove();S.on=1;S.sp=18;navigator.geolocation.getCurrentPosition(p=>{S.lat=p.coords.latitude;S.lon=p.coords.longitude;document.querySelector('#t').textContent=`GPS ${S.lat.toFixed(5)}, ${S.lon.toFixed(5)}`;load()},()=>{S.lat=36.1627;S.lon=-86.7816;load();document.querySelector('#t').textContent='GPS unavailable · Nashville fallback'},{enableHighAccuracy:1,timeout:10000,maximumAge:60000})}go.onclick=start;m.onclick=()=>{S.fly=!S.fly;S.sp=S.fly?35:10;m.textContent=S.fly?'FLY':'WALK'};r.onclick=()=>{cam.position.set(0,S.fly?12:4.5,0);S.yaw=S.pitch=0};let modes=['clear','rain','fog'],wi=0;w.onclick=()=>{wi=(wi+1)%3;w.textContent=modes[wi].toUpperCase();sc.fog.density=wi===0?.0007:wi===1?.0015:.003};let a=0,j=document.querySelector('#j'),k=document.querySelector('#k');function joy(x,y){let q=j.getBoundingClientRect(),dx=x-(q.left+60),dy=y-(q.top+60),L=Math.hypot(dx,dy),M=48;if(L>M){dx*=M/L;dy*=M/L}k.style.transform=`translate(${dx}px,${dy}px)`;S.jx=dx/M;S.jy=dy/M}j.onpointerdown=e=>{a=1;j.setPointerCapture(e.pointerId);joy(e.clientX,e.clientY)};j.onpointermove=e=>a&&joy(e.clientX,e.clientY);j.onpointerup=()=>{a=0;S.jx=S.jy=0;k.style.transform=''};let la=0,lx=0,ly=0;l.onpointerdown=e=>{la=1;lx=e.clientX;ly=e.clientY;l.setPointerCapture(e.pointerId)};l.onpointermove=e=>{if(!la)return;S.yaw-=(e.clientX-lx)*.006;S.pitch-=(e.clientY-ly)*.004;S.pitch=Math.max(-1.4,Math.min(1.4,S.pitch));lx=e.clientX;ly=e.clientY};l.onpointerup=()=>la=0;onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)};
</script>
